services:
  display:
    build: .
    image: display-kiosk:latest
    container_name: display-kiosk
    restart: unless-stopped
    extra_hosts:
      # lets the container reach services on the host (needed on Linux)
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:80:3001"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DB_PATH=/app/data/products.db
      # Required: Flask screen server, e.g. http://192.168.1.10:5000
      - SCREEN_SERVER_URL=${SCREEN_SERVER_URL:?SCREEN_SERVER_URL must be set}
    volumes:
      # Persist SQLite database
      - display-db:/app/data

volumes:
  display-db:
